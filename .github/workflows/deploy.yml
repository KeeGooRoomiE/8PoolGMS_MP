name: Deploy to GitHub Pages

on:
  push:
    branches: [godot]
    paths:
      - "godot/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.3"
  GODOT_RELEASE: "stable"
  BUILD_DIR: build

jobs:
  # ── Job 1: Собрать Web-экспорт ──────────────────────────────────────────
  build:
    name: Godot Web Export
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Cache Godot binaries
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: |
            /usr/local/bin/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-${{ env.GODOT_RELEASE }}

      - name: Install Godot ${{ env.GODOT_VERSION }}
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          FILENAME="Godot_v${GODOT_VERSION}-${GODOT_RELEASE}_linux.x86_64"
          wget -q \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-${GODOT_RELEASE}/${FILENAME}.zip" \
            -O godot.zip
          unzip -q godot.zip
          mv "${FILENAME}" /usr/local/bin/godot
          chmod +x /usr/local/bin/godot

      - name: Install export templates
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          TEMPLATES_DIR=~/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_RELEASE}
          mkdir -p "$TEMPLATES_DIR"
          wget -q \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-${GODOT_RELEASE}/Godot_v${GODOT_VERSION}-${GODOT_RELEASE}_export_templates.tpz" \
            -O templates.tpz
          unzip -q templates.tpz
          mv templates/* "$TEMPLATES_DIR/"
          rm -rf templates templates.tpz

      - name: Import project resources
        run: |
          cd godot
          godot --headless --import 2>&1 || true
          sleep 3

      - name: Export Web build
        run: |
          mkdir -p ${{ env.BUILD_DIR }}
          cd godot
          godot --headless \
            --export-release "Web" \
            "$GITHUB_WORKSPACE/${{ env.BUILD_DIR }}/index.html"
          ls -lh "$GITHUB_WORKSPACE/${{ env.BUILD_DIR }}/"

      - name: Inject coi-serviceworker (SharedArrayBuffer на Pages)
        run: |
          curl -sSL \
            "https://cdn.jsdelivr.net/gh/nicktindall/cyclon.html@main/coi-serviceworker.js" \
            -o "${{ env.BUILD_DIR }}/coi-serviceworker.js"
          sed -i 's|</head>|<script src="coi-serviceworker.js"></script>\n</head>|' \
            "${{ env.BUILD_DIR }}/index.html"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./${{ env.BUILD_DIR }}

  # ── Job 2: Задеплоить на GitHub Pages ───────────────────────────────────
  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
