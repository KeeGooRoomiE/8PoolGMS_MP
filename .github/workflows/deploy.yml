name: Deploy to GitHub Pages

on:
  push:
    branches: [godot]
    paths:
      - "godot/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.3"
  GODOT_RELEASE: "stable"
  BUILD_DIR: build

jobs:
  build:
    name: Godot Web Export
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2
        with:
          lfs: true

      - name: Cache Godot binaries
        id: cache-godot
        uses: actions/cache@v4.2.3
        with:
          path: |
            /usr/local/bin/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-${{ env.GODOT_RELEASE }}

      - name: Install Godot ${{ env.GODOT_VERSION }}
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          FILENAME="Godot_v${GODOT_VERSION}-${GODOT_RELEASE}_linux.x86_64"
          wget -q \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-${GODOT_RELEASE}/${FILENAME}.zip" \
            -O godot.zip
          unzip -q godot.zip
          mv "${FILENAME}" /usr/local/bin/godot
          chmod +x /usr/local/bin/godot
          godot --version

      - name: Install export templates
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          TEMPLATES_DIR=~/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_RELEASE}
          mkdir -p "$TEMPLATES_DIR"
          wget -q \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-${GODOT_RELEASE}/Godot_v${GODOT_VERSION}-${GODOT_RELEASE}_export_templates.tpz" \
            -O templates.tpz
          unzip -q templates.tpz
          mv templates/* "$TEMPLATES_DIR/"
          rm -rf templates templates.tpz

      # Правильная команда импорта для Godot 4: --editor --quit-after
      - name: Import project resources
        run: |
          godot --headless --editor --quit-after 60 --path "$GITHUB_WORKSPACE/godot" 2>&1 || true
          sleep 5

      - name: Export Web build
        run: |
          mkdir -p ${{ env.BUILD_DIR }}
          godot --headless \
            --export-release "Web" \
            "$GITHUB_WORKSPACE/${{ env.BUILD_DIR }}/index.html" \
            --path "$GITHUB_WORKSPACE/godot"
          echo "── Build output ──"
          ls -lh "$GITHUB_WORKSPACE/${{ env.BUILD_DIR }}/"

      # gzuidhof/coi-serviceworker — стандартный инструмент для COOP/COEP на Pages
      - name: Add coi-serviceworker (SharedArrayBuffer support)
        run: |
          curl -sSL \
            "https://raw.githubusercontent.com/gzuidhof/coi-serviceworker/master/coi-serviceworker.js" \
            -o "${{ env.BUILD_DIR }}/coi-serviceworker.js"
          sed -i 's|</head>|<script src="coi-serviceworker.js"></script></head>|' \
            "${{ env.BUILD_DIR }}/index.html"

      # .nojekyll — без него Jekyll съедает .pck и .wasm файлы
      - name: Add .nojekyll
        run: touch "${{ env.BUILD_DIR }}/.nojekyll"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3.0.1
        with:
          path: ./${{ env.BUILD_DIR }}

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4.0.5
